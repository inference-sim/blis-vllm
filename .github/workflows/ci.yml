name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "rules"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: no replace directive
        run: '! grep -n "^replace" go.mod'
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "rules"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      # The module targets Go 1.27; golangci-lint refuses a module newer than the Go that built
      # it, so it is built from source with the module's Go (as inference-sim's CI does).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: ${{ matrix.module }}

  # Each rules pack transcribes one vLLM release by hand; these tests re-derive its constants
  # from that release's own source and fail on any difference in either direction. Each pack is
  # checked against the tag it describes.
  packs-against-vllm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pack: v0_29
            tag: v0.29.0
          - pack: v0_31
            tag: v0.31.0
          - pack: v0_32
            tag: v0.32.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rules/go.mod
      - name: check out vLLM at the pack's release
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: ${{ matrix.tag }}
          path: vllm-source
          fetch-depth: 1
      - name: verify pack constants
        working-directory: rules
        env:
          VLLM_SOURCE: ${{ github.workspace }}/vllm-source
          VLLM_SOURCE_REQUIRED: "1"
        run: go test -v -run MatchSource ./${{ matrix.pack }}/

  # A golden trace is vLLM's own output; a commit that changes one must name its reviewer.
  goldens-reviewed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit changing a golden trace has a golden-reviewed trailer
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 -I oracle/check_goldens.py "$BASE" "$HEAD"

  # Tier 2: vLLM v0.32.0's real Scheduler driven through every scenario, on CPU.
  oracle-tier2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check out vLLM v0.32.0 (for its test helpers)
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: v0.32.0
          path: vllm-source
          fetch-depth: 1
      - name: install the oracle environment
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r oracle/requirements.txt
          pip freeze > oracle-env.lock
      - name: the mocks replace no decision code
        run: python -I oracle/check_mocks.py oracle/mocks.json
      # The scheduler helper's default model, as configuration only (no weights), at a pinned
      # revision, so a change on the Hub cannot change a run.
      - name: fetch the helper model's configuration at its pinned revision
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("facebook/opt-125m", revision="27dcfa74d334bc871f3234de431e71c6eeba5dd6",
                            local_dir="oracle-model", allow_patterns=["*.json", "*.txt"])
          PY
      - name: run every tier-2 scenario
        env:
          ORACLE_LOCKFILE: ${{ github.workspace }}/oracle-env.lock
          ORACLE_MODEL: ${{ github.workspace }}/oracle-model
          ORACLE_MODEL_REVISION: 27dcfa74d334bc871f3234de431e71c6eeba5dd6
          HF_HUB_OFFLINE: "1"
        run: |
          mkdir -p oracle/out/scenarios
          python -I oracle/run_scheduler.py vllm-source oracle/scenarios oracle/out/scenarios
      # The committed goldens must be what the pinned vLLM release produces here and now.
      - name: every golden trace is vLLM's own output
        run: python3 -I oracle/compare_goldens.py core/sched/testdata/golden oracle/out/scenarios
      # The seeded fuzz corpus: 2000 random scenarios from fixed seeds, each run through vLLM's
      # Scheduler and then through blis-vllm, which must match at zero mismatches.
      - name: generate the fuzz corpus and vLLM's traces for it
        env:
          ORACLE_LOCKFILE: ${{ github.workspace }}/oracle-env.lock
          ORACLE_MODEL: ${{ github.workspace }}/oracle-model
          ORACLE_MODEL_REVISION: 27dcfa74d334bc871f3234de431e71c6eeba5dd6
          HF_HUB_OFFLINE: "1"
        run: |
          python -I oracle/gen_fuzz.py oracle/out/fuzz 1000 2000
          python -I oracle/run_scheduler.py vllm-source oracle/out/fuzz
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: blis-vllm against vLLM (differential + fuzz)
        env:
          BLIS_VLLM_FUZZ_DIR: ${{ github.workspace }}/oracle/out/fuzz
        run: |
          set -o pipefail
          go test -v -count=1 -run 'TestDifferentialAgainstVLLM|TestFuzzCorpusAgainstVLLM' ./core/sched/ | tee oracle/out/diff-results.txt
      # Each supported row's mutants must be caught by the tests above (docs/testing.md).
      - name: mutation sweep
        run: |
          set -o pipefail
          python3 -I oracle/mutate.py . oracle/out/fuzz "$RUNNER_TEMP/mutants" | tee oracle/out/mutation-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-tier2
          path: |
            oracle/out/
            oracle-env.lock
