name: ci

on:
  push:
    branches: [main]
  pull_request:
    # The full set judges a pull request whose base is main, the one that merges. A layer of a stack
    # (any other base) runs ci-light.yml; the full set stays available on any branch by
    # workflow_dispatch. Retargeting a pull request to main is a change of its base branch, which
    # GitHub reports as the activity type `edited` (not a default type), so `edited` is listed:
    # without it the retarget starts no run. ready_for_review is listed so a draft marked ready is
    # judged too. (Editing the title or body of a main-based pull request starts a run as well, and
    # the newer run replaces the one in progress.)
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      base:
        description: >-
          The commit goldens-reviewed judges this branch against. Empty: the nearest remote branch
          that is a strict ancestor of the dispatched one (oracle/check_goldens.py --stack-base).
        required: false
        default: ""

permissions:
  contents: read

# A newer push to a pull request makes the run of the head before it moot, and each run is 17 jobs and about an
# hour of runner time, so a pull request's run is cancelled by the next one. The group is the pull request, so the
# stack's other pull requests and the runs on main are not touched; a run on main or by hand is never cancelled.
# Branch protection does not read the cancelled run: the superseding push starts a fresh run of the same checks
# for the new head, and the `go` job fails, not passes, if a job it needs was cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # setup-go v5 caches the module download cache (GOMODCACHE) and the build cache (GOCACHE),
  # keyed on go.sum and the Go version (cache: true is its default); every Go job below restores
  # the same cache, so a run that changes no dependency does not download modules again. go vet
  # runs once, in go-build; the test jobs do not repeat it (go test runs its own small vet subset).

  # The one check branch protection requires is named `go`; it passes only if every job below
  # it passed (or was skipped), and fails if one failed or was cancelled. Splitting the former
  # single job into parallel jobs keeps every check and every test; this job is the same name
  # the protection rule already requires.
  go:
    name: go
    if: always()
    needs: [go-build, go-test-kerneltests, go-test-rest, go-bench, go-race-guard, go-race]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          bad=$(printf '%s' "$RESULTS" | python3 -c 'import json,sys; n=json.load(sys.stdin); print(" ".join(k for k,v in n.items() if v["result"] not in ("success","skipped")))')
          if [ -n "$bad" ]; then echo "failed or cancelled: $bad"; exit 1; fi
          echo "every go job passed"

  go-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: no replace directive
        run: '! grep -n "^replace" go.mod'
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...

  # kerneltests is pure computation: nothing it calls holds a goroutine or shared mutable state
  # (the race guard in go-race checks that no package outside the race list does), so -race on it
  # cost about ten minutes and could find nothing. The race detector runs in go-race instead.
  # The timeout is raised so a slow hosted runner fails on a test, not on go test's default 10m
  # per-package limit.
  go-test-kerneltests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: kerneltests
        run: go test -timeout 30m ./kerneltests/...
      # The kernel tests that read the kernel's unexported state run inside the kernel package
      # of the blis-substrate this module pins (kerneltests/_inpackage).
      - name: kernel tests in the kernel package
        run: kerneltests/scripts/run-inpackage.sh

  # Every package except kerneltests, without -race. The packages with concurrency are run again
  # with -race in go-race.
  go-test-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -timeout 30m $(go list ./... | grep -v '/kerneltests')

  # The speed benchmarks of the v0.32.0 engine: a decode step at 512 and at 32,768 tokens of
  # context (core/sched), and the engine interface over long decodes (core/vllm). Wall time on a
  # shared runner is too noisy for a hard threshold, so the numbers are recorded in an artifact;
  # the check that fails a build is TestDecodeStepAllocationDoesNotGrowWithContext, which runs
  # in go-test-rest and bounds the bytes a step allocates, which do not vary between runs.
  go-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: benchmarks
        run: go test -run '^$' -bench . -benchmem -benchtime 20x ./core/sched ./core/vllm | tee bench.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-bench
          path: bench.txt

  # The race detector stays on every package that holds a goroutine, channel, atomic, mutex or
  # Once. Today those are internal/substratedata (a sync.Once), core/vllm (the registration Once)
  # and compat/prefix (two atomic counters); the guard below re-derives them from the non-test
  # sources on every run. The legs also run the packages that drive them: compat/kv and compat/engine
  # (through compat/prefix), vllmengine, core/sched, core/engine, core/connector, compat/dplb and
  # compat/kvtransfer (through core/vllm).
  #
  # compat/kernelmodel's non-test sources hold no primitive and start no goroutine, but its census test
  # (TestBlockSizeResolutionOverTheCensusFixtures) runs parallel subtests that share counters under a
  # sync.Mutex, and the package drives core/vllm through its registration Once. So one leg raced
  # exactly the tests that use t.Parallel, sync or a goroutine (derived with grep over its _test.go
  # files: that one test). The rest of compat/kernelmodel, about 90 seconds of serial pricing tests, is
  # raced nowhere: under -race it took 1,659 seconds, and it holds no goroutine of its own.
  #
  # The guard is its own small job. The race run is a matrix with one leg for each package or
  # small group, so the job's wall-clock is the slowest leg, not the sum. The matrix legs are not
  # required checks: `go` aggregates them.
  go-race-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The same list the legs below run, space separated. Keep the two in step: the guard fails
      # when a package with a primitive is in neither this list nor EXCLUDED, and each leg's
      # `pkgs` is checked against this list by the first guard step.
      RACE_PKGS: >-
        ./internal/substratedata ./core/vllm ./compat/prefix
        ./compat/engine ./core/sched ./core/engine ./vllmengine ./compat/dplb ./compat/kv
        ./compat/kvtransfer ./core/connector/...
      # Import paths of packages with concurrency primitives that run without -race, space
      # separated, each with its reason stated here. None today.
      EXCLUDED: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: every package with concurrency primitives is under -race
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # shellcheck disable=SC2086
          go list $RACE_PKGS | sort -u > "$tmp/raced"
          { printf '%s\n' $EXCLUDED; } | sort -u > "$tmp/excluded"
          git ls-files '*.go' ':!:*_test.go' ':!:*/testdata/*' ':!:*/_inpackage/*' \
            | xargs grep -lE 'go func|sync\.|atomic\.|chan ' | xargs -n1 dirname | sort -u \
            | while read -r d; do go list "./$d"; done | sort -u > "$tmp/concurrent"
          echo "packages with concurrency primitives:"; cat "$tmp/concurrent"
          missing="$(comm -23 "$tmp/concurrent" <(sort -u "$tmp/raced" "$tmp/excluded"))"
          if [ -n "$missing" ]; then echo "not under -race and not excluded:"; echo "$missing"; exit 1; fi
      # The matrix legs below carry their own package lists. A package in RACE_PKGS and in no leg
      # would pass the guard and never be raced, so the legs are read back out of this file (as
      # YAML, whatever its indentation) and compared with RACE_PKGS. A file with no legs fails
      # with a message, not with an empty comparison.
      - name: the race legs run exactly the guarded packages
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # shellcheck disable=SC2086
          go list $RACE_PKGS | sort -u > "$tmp/guarded"
          python3 - "$tmp/legs" <<'PY'
          import json, re, subprocess, sys
          text = open(".github/workflows/ci.yml").read()
          # The go-race job's matrix.include entries: each has a name and a pkgs line.
          start = text.index("\n  go-race:\n")
          block = text[start:text.index("\n  lint:\n", start)]
          legs = re.findall(r"^\s+pkgs:\s*(.+?)\s*$", block, re.M)
          if not legs:
              sys.exit("the guard found no go-race matrix legs (no 'pkgs:' lines under the go-race job): "
                       "the workflow was restructured, and this step must be updated with it")
          pkgs = sorted({p for leg in legs for p in leg.split()})
          out = subprocess.run(["go", "list", *pkgs], capture_output=True, text=True, check=True).stdout.split()
          open(sys.argv[1], "w").write("\n".join(sorted(set(out))) + "\n")
          print("go-race legs: %d, packages: %d" % (len(legs), len(set(out))))
          PY
          if ! diff "$tmp/guarded" "$tmp/legs"; then echo "RACE_PKGS and the go-race legs differ"; exit 1; fi

  go-race:
    name: go-race (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vllmengine-a
            pkgs: ./vllmengine
            run: '^(TestMuse|TestDashboardDeploymentsBuild|TestDashboardDataParallel|TestKVPool|TestAnAllWindow)'
          - name: vllmengine-b
            pkgs: ./vllmengine
            skip: '^(TestMuse|TestDashboardDeploymentsBuild|TestDashboardDataParallel|TestKVPool|TestAnAllWindow)'
          - name: core
            pkgs: ./internal/substratedata ./core/vllm ./core/sched ./core/engine ./core/connector/...
          - name: compat
            pkgs: ./compat/prefix ./compat/engine ./compat/dplb ./compat/kv ./compat/kvtransfer
          # The one compat/kernelmodel test that runs parallel subtests under a mutex. Its package is
          # not in RACE_PKGS (no primitive in its sources), so this leg names its package as
          # race_pkgs, which the guard does not read.
          - name: kernelmodel-census
            race_pkgs: ./compat/kernelmodel
            run: '^TestBlockSizeResolutionOverTheCensusFixtures$'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go test -race
        env:
          PKGS: ${{ matrix.pkgs || matrix.race_pkgs }}
          ONLY: ${{ matrix.run }}
          SKIP: ${{ matrix.skip }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$ONLY" ]; then args+=(-run "$ONLY"); fi
          if [ -n "$SKIP" ]; then args+=(-skip "$SKIP"); fi
          # shellcheck disable=SC2086
          go test -race -timeout 30m "${args[@]}" $PKGS

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # golangci-lint refuses a module newer than the Go that built it, so it is built from
      # source with the Go go.mod names (as inference-sim's CI does).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.14.0
          install-mode: goinstall

  # Each rules pack transcribes one vLLM release by hand; these tests re-derive its constants
  # from that release's own source and fail on any difference in either direction. Each pack is
  # checked against the tag it describes.
  packs-against-vllm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each tag's commit is pinned, so a moved tag fails the check below instead of
        # silently changing what the pack is compared against.
        include:
          - pack: v0_29
            tag: v0.29.0
            commit: 98dff2a81d747d1dba01a47f939f48c3526d4206
          - pack: v0_31
            tag: v0.31.0
            commit: db9527a46873454610df6dbedf79a36d6bf1a7f6
          - pack: v0_32
            tag: v0.32.0
            commit: 5df63a7203cdb9328d824a27b682e77c7b9928be
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: check out vLLM at the pack's release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: vllm-project/vllm
          ref: ${{ matrix.commit }}
          path: vllm-source
          fetch-depth: 1
      - name: the checked-out vLLM is the pinned commit of the pack's release
        run: test "$(git -C vllm-source rev-parse HEAD)" = "${{ matrix.commit }}"
      - name: verify pack constants
        working-directory: rules
        env:
          VLLM_SOURCE: ${{ github.workspace }}/vllm-source
          VLLM_SOURCE_REQUIRED: "1"
        run: |
          set -o pipefail
          mkdir -p ../tier1-out
          go test -v -run MatchSource ./${{ matrix.pack }}/ | tee ../tier1-out/match-source-${{ matrix.pack }}.txt
      # Provenance for the tier-1 results: the commit checked, the vLLM tag and its commit, Go.
      - name: record tier-1 provenance
        run: |
          printf '{"tier": 1, "pack": "%s", "vllm_tag": "%s", "vllm_commit": "%s", "blis_vllm_commit": "%s", "go_version": "%s"}\n' \
            "${{ matrix.pack }}" "${{ matrix.tag }}" "$(git -C vllm-source rev-parse HEAD)" "$GITHUB_SHA" "$(go env GOVERSION)" \
            > tier1-out/provenance-${{ matrix.pack }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tier1-${{ matrix.pack }}
          path: tier1-out/

  # Tier 5: every vllm:* family vLLM v0.32.0 defines, read from its source and classified
  # exact / derived / unavailable (docs/metrics-manifest.json). A family the release adds or
  # drops, or a manifest that is not current, fails here.
  metrics-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: check out vLLM v0.32.0 at its pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: vllm-project/vllm
          ref: 5df63a7203cdb9328d824a27b682e77c7b9928be
          path: vllm-source
          fetch-depth: 1
      - name: the checked-out vLLM is the pinned commit
        run: test "$(git -C vllm-source rev-parse HEAD)" = 5df63a7203cdb9328d824a27b682e77c7b9928be
      - name: fields.json is current for the pinned release
        run: python3 -I fields/gen_fields.py vllm-source fields/status.json --value-classes fields/value_classes.json --check fields.json
      - name: the field-list generator's tests
        run: python3 -I fields/test_gen_fields.py
      - name: stand-ins held to the upstream's own resolution
        run: VLLM_SOURCE=vllm-source python3 -I fields/test_stand_in.py
      - name: fields/value_classes.json is current for the pinned release
        run: python3 -I fields/gen_classes.py vllm-source fields.json --check fields/value_classes.json
      - name: the value-class generator's tests, and every class cites a comparison the pinned source holds
        env:
          VLLM_SOURCE: ${{ github.workspace }}/vllm-source
        run: python3 -I fields/test_classes.py
      - name: the manifest is current for the pinned release
        run: |
          set -o pipefail
          mkdir -p manifest-out
          go run ./cmd/metricsmanifest -vllm vllm-source -check 2>&1 | tee manifest-out/manifest-check.txt
      # The connector registry's entries are connectors the release registers.
      - name: every registry entry is a connector vLLM v0.32.0 registers
        env:
          VLLM_SOURCE: ${{ github.workspace }}/vllm-source
        run: go test -v -run TestEveryEntryNamesAConnectorVLLMRegisters ./registry/
      # Provenance for the manifest result: the vLLM commit checked, the blis-vllm commit, Go.
      - name: record the manifest's provenance
        run: |
          printf '{"tier": 5, "check": "metrics-manifest", "vllm_tag": "v0.32.0", "vllm_commit": "%s", "blis_vllm_commit": "%s", "go_version": "%s"}\n' \
            "$(git -C vllm-source rev-parse HEAD)" "$GITHUB_SHA" "$(go env GOVERSION)" > manifest-out/provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: metrics-manifest
          path: manifest-out/

  # A golden trace is vLLM's own output; a commit that changes one must name its reviewer.
  goldens-reviewed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: every commit changing a golden trace has a golden-reviewed trailer
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || inputs.base }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A run started by hand has neither a pull request nor a previous push: judge the branch against the
          # layer it stands on, not against the root (which would hold every golden of the stack to the new rules).
          if [ -z "$BASE" ]; then BASE="$(python3 -I oracle/check_goldens.py --stack-base "$HEAD")"; fi
          echo "goldens-reviewed: $BASE..$HEAD"
          python3 -I oracle/check_goldens.py "$BASE" "$HEAD"
      # Each guard must fail on the violation it exists to catch (oracle/test_checks.py).
      - name: the oracle's guards catch what they guard
        run: python3 -I oracle/test_checks.py
      - name: the engine-block migration rewrites what it says and refuses what it cannot
        run: python3 -I tools/migrateengineblock/test_migrate.py
      - name: the block-size oracle's config.json fetch is verified
        run: python3 -I oracle/blocksize/test_modelconfig.py

  # Tier 2: vLLM v0.32.0's real Scheduler driven through every scenario, on CPU. The fuzz corpora
  # and vLLM's traces for them come from the cache (.github/actions/oracle-fuzz); every committed
  # golden is re-derived from vLLM here on every run. The mutation sweeps are mutation.yml's.
  oracle-tier2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: oracle/requirements-hashed.txt
      - name: check out vLLM v0.32.0 (for its test helpers) at its pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: vllm-project/vllm
          ref: 5df63a7203cdb9328d824a27b682e77c7b9928be
          path: vllm-source
          fetch-depth: 1
      - name: the checked-out vLLM is the pinned commit
        run: test "$(git -C vllm-source rev-parse HEAD)" = 5df63a7203cdb9328d824a27b682e77c7b9928be
      # The whole environment is pinned (oracle/requirements.lock, every package == or a sha256
      # URL) and installed without resolving, from oracle/requirements-hashed.txt with every
      # archive's sha256 (oracle/lock.sh, X21), so neither a transitive release nor a replaced
      # archive can change a run; the step fails if what got installed is not exactly the lock.
      - name: install the oracle environment
        run: |
          python -I oracle/check_lock.py --hashed oracle/requirements.lock oracle/requirements-hashed.txt
          python -m pip install --require-hashes -r oracle/requirements-pip.txt
          pip install --require-hashes --no-deps --extra-index-url https://download.pytorch.org/whl/cpu -r oracle/requirements-hashed.txt
          pip check
          pip freeze > oracle-env.lock
          python -I oracle/check_lock.py oracle/requirements.lock oracle-env.lock
      - name: the mocks replace no decision code
        run: python -I oracle/check_mocks.py oracle/mocks.json
      # An unstated block_size is vLLM's own choice, from the attention backends it selects for the
      # model, GPU and KV dtype (core/vllm/blocksize.go). The oracle runs vLLM's selection on this
      # CPU, with every replacement listed in its table, and the committed table must equal what
      # it prints. The models' config.json files are the pinned blis-substrate's catalog.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: the block-size table is vLLM's own selection
        run: |
          catalog="$(go list -m -f '{{.Dir}}' github.com/inference-sim/blis-substrate)/catalog/models"
          BLIS_ORACLE_CATALOG="$catalog" python -I oracle/blocksize/oracle.py vllm-source check core/vllm/blocksize_table.json oracle/blocksize/TABLE.tsv
      # The quantization vLLM serves a DeepSeek-V4 FP8 checkpoint with, for each value a deployment
      # can state, from vLLM's own ModelConfig over the catalog's config.json.
      - name: the quantization resolutions are vLLM's own
        run: |
          catalog="$(go list -m -f '{{.Dir}}' github.com/inference-sim/blis-substrate)/catalog/models"
          BLIS_ORACLE_CATALOG="$catalog" python -I oracle/quantization/oracle.py vllm-source check oracle/quantization/resolved.json
      # speculative_config.synthetic_acceptance_length, resolved to per-position rates by vLLM's own
      # function over a grid of lengths, valid and not (the sampler that consumes the rates needs a GPU).
      - name: the synthetic acceptance resolutions are vLLM's own
        run: python -I oracle/synthetic_acceptance/oracle.py vllm-source check rules/engineconfig/testdata/synthetic_acceptance.json
      # The lowering (core/lower) is held to vLLM's own CUDA-graph capture, dispatch and
      # data-parallel padding code, run unmodified with only the all-reduce supplied (FID-1,
      # FID-8). The committed answers must equal what the pinned release gives now.
      - name: the lowering's expected answers are vLLM's own
        run: python -I oracle/lower/extract.py vllm-source check core/lower/testdata/vllm_lower.json
      - name: every replacement the lowering oracle makes is listed
        run: |
          python3 -I oracle/lower/check_replacements.py oracle/lower/extract.py oracle/lower/replacements.json
          python3 -I oracle/lower/test_check_replacements.py
      # The DeepSeek indexer's cache dtype (rules/pack ResolveIndexerKVDType) is held to vLLM's own
      # resolution and record-width code, run unmodified over a stub platform (FID-1, FID-8).
      - name: the indexer cache dtype table is vLLM's own
        run: |
          python -I oracle/indexer/oracle.py vllm-source check rules/v0_32/testdata/vllm_indexer_kv_dtype.json
          python3 -I oracle/lower/check_replacements.py oracle/indexer/oracle.py oracle/indexer/replacements.json
      # The scheduler helper's default model, as configuration only (no weights), at a pinned
      # revision, so a change on the Hub cannot change a run.
      - name: fetch the helper model's configuration at its pinned revision
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("facebook/opt-125m", revision="27dcfa74d334bc871f3234de431e71c6eeba5dd6",
                            local_dir="oracle-model", allow_patterns=["*.json", "*.txt"])
          PY
      # Tier 5: the families vLLM's own Prometheus logger registers at runtime agree with the
      # manifest the source scan wrote (type and labels).
      - name: the metrics manifest agrees with vLLM's live registry
        env:
          ORACLE_MODEL: ${{ github.workspace }}/oracle-model
          HF_HUB_OFFLINE: "1"
        run: |
          python -I oracle/check_manifest.py vllm-source docs/metrics-manifest.json --buckets oracle/out-buckets.json
          diff -u docs/metrics-buckets.json oracle/out-buckets.json
      - name: run every tier-2 scenario
        env:
          ORACLE_LOCKFILE: ${{ github.workspace }}/oracle-env.lock
          ORACLE_MODEL: ${{ github.workspace }}/oracle-model
          ORACLE_MODEL_REVISION: 27dcfa74d334bc871f3234de431e71c6eeba5dd6
          HF_HUB_OFFLINE: "1"
          # the helper model's config states 2048 positions; a dashboard scenario states its deployment's
          # max_model_len (oracle/README.md)
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
        run: |
          mkdir -p oracle/out/scenarios
          python -I oracle/run_scheduler.py vllm-source oracle/scenarios oracle/out/scenarios
      # The committed goldens must be what the pinned vLLM release produces here and now.
      - name: every golden trace is vLLM's own output
        run: python3 -I oracle/compare_goldens.py core/sched/testdata/golden oracle/out/scenarios
      # Tier 1: every inertness proof (oracle/inertness/*.json) is what the harness computes from vLLM's
      # own code now, and the harness finds a field that is not inert, a read it was not told about and a
      # variable the source names.
      - name: every inertness proof is what the harness computes
        env:
          ORACLE_MODEL: ${{ github.workspace }}/oracle-model
          ORACLE_MODEL_REVISION: 27dcfa74d334bc871f3234de431e71c6eeba5dd6
          HF_HUB_OFFLINE: "1"
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
          VLLM_SOURCE: ${{ github.workspace }}/vllm-source
        run: python -I oracle/test_inertness.py
      # Tier 5's goldens too: each metric series re-derived from vLLM's own Prometheus logger
      # on the scenario it was made from.
      - name: every metric golden is vLLM's own series
        env:
          ORACLE_LOCKFILE: ${{ github.workspace }}/oracle-env.lock
          ORACLE_MODEL: ${{ github.workspace }}/oracle-model
          ORACLE_MODEL_REVISION: 27dcfa74d334bc871f3234de431e71c6eeba5dd6
          HF_HUB_OFFLINE: "1"
        run: |
          mkdir -p oracle/out/metrics-scenarios oracle/out/metrics
          for g in core/metrics/testdata/golden/*.metrics.json; do
            cp "oracle/scenarios/$(basename "$g" .metrics.json).json" oracle/out/metrics-scenarios/
          done
          python -I oracle/run_metrics.py vllm-source oracle/out/metrics-scenarios oracle/out/metrics
          python3 -I oracle/compare_goldens_metrics.py core/metrics/testdata/golden oracle/out/metrics
      # Tier 1, the dynamic half: the engine-block shapes of oracle/engineargs-cases.json run
      # through vLLM's own EngineArgs(...).create_engine_config(), and the committed answers the
      # factory is compared with (core/vllm TestEngineArgsAgainstVLLM) must equal them.
      - name: the EngineArgs answers are vLLM's own
        env:
          ORACLE_LOCKFILE: ${{ github.workspace }}/oracle-env.lock
          ORACLE_MODEL: ${{ github.workspace }}/oracle-model
          ORACLE_MODEL_REVISION: 27dcfa74d334bc871f3234de431e71c6eeba5dd6
          HF_HUB_OFFLINE: "1"
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
        run: |
          mkdir -p oracle/out
          python -I oracle/run_engineargs.py vllm-source oracle/engineargs-cases.json > oracle/out/engineargs.json
          python3 -I oracle/compare_engineargs.py core/vllm/testdata/engineargs.json oracle/out/engineargs.json
          # Every key the engine block takes is a name vLLM's EngineArgs takes (blis-vllm#93): ask the
          # pinned vLLM about the keys the committed answer covers, and compare.
          python3 -I - <<'PY' > oracle/out/block-keys.json
          import json
          t = json.load(open("rules/engineconfig/testdata/vllm_names.json"))
          print(json.dumps({"top": sorted(t["top"]), "nested": {g: sorted(v) for g, v in t["nested"].items()}}))
          PY
          python -I oracle/run_engineargs.py --key-names vllm-source oracle/out/block-keys.json > oracle/out/vllm_names.json
          python3 -I -c "import json,sys; a,b=(json.load(open(f)) for f in sys.argv[1:]); sys.exit(0 if a==b else 'the EngineArgs name answers differ from rules/engineconfig/testdata/vllm_names.json')" rules/engineconfig/testdata/vllm_names.json oracle/out/vllm_names.json
      # The block-hash fixture: every case's hashes recomputed by vLLM's own hash_block_tokens;
      # the generator exits non-zero if any differs from the committed file.
      - name: the block-hash fixture is vLLM's own hashes
        env:
          ORACLE_LOCKFILE: ${{ github.workspace }}/oracle-env.lock
        run: python -I oracle/gen_block_hashes.py vllm-source core/kv/testdata/block_hashes.json > oracle/out/block_hashes.json
      # Block hashes under a stated PYTHONHASHSEED, from vLLM's own init_none_hash and hash_block_tokens.
      - name: the seeded block-hash fixture is vLLM's own hashes
        run: |
          python -I oracle/gen_seeded_block_hashes.py vllm-source > oracle/out/seeded_block_hashes.json
          diff -u core/kv/testdata/seeded_block_hashes.json oracle/out/seeded_block_hashes.json
      # The seeded fuzz corpora (tier 2: 4000 scenarios; tier 3: 1000, DP: 1000; the connector:
      # 3300), each from fixed seeds and run through vLLM, then through blis-vllm below, which must
      # match at zero mismatches. Cached, keyed on the generators, seeds, runners, mock, lock and
      # vLLM pin; regenerated when any of them changes.
      - name: the fuzz corpora and vLLM's traces for them
        uses: ./.github/actions/oracle-fuzz
        with:
          python-version: ${{ steps.python.outputs.python-version }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The Go side of the run's provenance: blis-vllm's ProvenanceFor, the commit, Go and the
      # platform. Each trace carries the Python side (vLLM, lockfile, mocks, seed, commit).
      - name: record the Go side's provenance
        run: go run ./cmd/provenance > oracle/out/provenance.json
      # The property and metamorphic tests (#2021 B8) run over fixed seeds in Go alone; their
      # verbose results go into the artifact beside the provenance above.
      - name: property and metamorphic tests
        run: |
          set -o pipefail
          go test -v -count=1 -run 'TestPropertiesHoldOnRandomScenarios|TestMoreKVNeverAddsPreemptionsOneAtATime|TestLargerBudgetNeverDelaysALoneRequestsFirstToken' ./core/sched/ | tee oracle/out/property-results.txt
      - name: blis-vllm against vLLM (differential + fuzz)
        env:
          BLIS_VLLM_FUZZ_DIR: ${{ github.workspace }}/oracle/out/fuzz
        run: |
          set -o pipefail
          go test -v -count=1 -run 'TestDifferentialAgainstVLLM|TestFuzzCorpusAgainstVLLM' ./core/sched/ | tee oracle/out/diff-results.txt
      # Tier 5: every exact vllm:* family, after every step, against vLLM's own Prometheus
      # logger on the same scenarios and fuzz seeds.
      - name: blis-vllm's metrics against vLLM's (scenarios + fuzz)
        env:
          BLIS_VLLM_METRICS_FUZZ_DIR: ${{ github.workspace }}/oracle/out/fuzz
        run: |
          set -o pipefail
          go test -v -count=1 -run 'TestMetricsAgainstVLLM|TestMetricsFuzzCorpusAgainstVLLM' ./core/metrics/ | tee oracle/out/metrics-results.txt
      # Tier 3: vLLM's own EngineCore.step_with_batch_queue (async scheduling, the batch
      # queue, PP) on every tier-3 scenario and 1000 fuzz seeds, then blis-vllm's core/engine.
      - name: run every tier-3 scenario through vLLM's EngineCore
        env:
          ORACLE_LOCKFILE: ${{ github.workspace }}/oracle-env.lock
          ORACLE_MODEL: ${{ github.workspace }}/oracle-model
          ORACLE_MODEL_REVISION: 27dcfa74d334bc871f3234de431e71c6eeba5dd6
          HF_HUB_OFFLINE: "1"
        run: |
          mkdir -p oracle/out/scenarios-t3
          python -I oracle/run_enginecore.py vllm-source oracle/scenarios-t3 oracle/out/scenarios-t3
          # Data parallel: vLLM's DP engine-core loop and internal load balancer; with async
          # scheduling, each rank's own step_with_batch_queue.
          mkdir -p oracle/out/scenarios-dp oracle/out/scenarios-dp-async oracle/out/scenarios-dp-nixl
          python -I oracle/run_dp.py vllm-source oracle/scenarios-dp oracle/out/scenarios-dp
          python -I oracle/run_dp.py vllm-source oracle/scenarios-dp-async oracle/out/scenarios-dp-async
          python -I oracle/run_dp.py vllm-source oracle/scenarios-dp-nixl oracle/out/scenarios-dp-nixl
      - name: every tier-3 golden trace is vLLM's own output
        run: |
          python3 -I oracle/compare_goldens_t3.py core/engine/testdata/golden oracle/out/scenarios-t3
          python3 -I oracle/compare_goldens_t3.py core/engine/testdata/golden-dp oracle/out/scenarios-dp
          python3 -I oracle/compare_goldens_t3.py core/engine/testdata/golden-dp-async oracle/out/scenarios-dp-async
          python3 -I oracle/compare_goldens_t3.py core/engine/testdata/golden-dp-nixl oracle/out/scenarios-dp-nixl
      - name: blis-vllm's EngineCore against vLLM's (scenarios + fuzz)
        env:
          BLIS_VLLM_T3_FUZZ_DIR: ${{ github.workspace }}/oracle/out/fuzz-t3
          BLIS_VLLM_DP_FUZZ_DIR: ${{ github.workspace }}/oracle/out/fuzz-t3-dp
        run: |
          set -o pipefail
          go test -v -count=1 -run 'TestEngineCoreAgainstVLLM|TestEngineCoreFuzzCorpusAgainstVLLM|TestDPAgainstVLLM|TestDPAsyncAgainstVLLM|TestDPNixlAgainstVLLM|TestDPFuzzCorpusAgainstVLLM' ./core/engine/ | tee oracle/out/engine-results.txt
      # Tier 4: vLLM's real NIXL connector scheduler side (pull mode), with only the worker's
      # transfer outcomes as the mock input, on every NIXL scenario and 1000 fuzz seeds.
      - name: run every NIXL scenario through vLLM's Scheduler
        env:
          ORACLE_LOCKFILE: ${{ github.workspace }}/oracle-env.lock
          ORACLE_MODEL: ${{ github.workspace }}/oracle-model
          ORACLE_MODEL_REVISION: 27dcfa74d334bc871f3234de431e71c6eeba5dd6
          HF_HUB_OFFLINE: "1"
        run: |
          mkdir -p oracle/out/scenarios-connector
          python -I oracle/run_connector.py vllm-source oracle/scenarios/connector oracle/out/scenarios-connector
      - name: every NIXL golden trace is vLLM's own output
        run: python3 -I oracle/compare_goldens.py core/connector/nixl/testdata/golden oracle/out/scenarios-connector
      - name: blis-vllm's NIXL connector against vLLM's (scenarios + fuzz)
        env:
          BLIS_VLLM_CONNECTOR_FUZZ_DIR: ${{ github.workspace }}/oracle/out/fuzz-connector
        run: |
          set -o pipefail
          go test -v -count=1 -run 'TestNIXLAgainstVLLM|TestNIXLFuzzCorpusAgainstVLLM' ./core/connector/nixl/ | tee oracle/out/connector-results.txt
      # Tier 4: vLLM's real OffloadingConnector scheduler side over its CPU tier (CPUOffloadingManager,
      # LRU), with only the worker mocked (completions as OffloadingWorkerMetadata), on every
      # offloading scenario and 2000 fuzz seeds (1000 with hybrid KV cache groups).
      - name: run every offloading scenario through vLLM's Scheduler
        env:
          ORACLE_LOCKFILE: ${{ github.workspace }}/oracle-env.lock
          ORACLE_MODEL: ${{ github.workspace }}/oracle-model
          ORACLE_MODEL_REVISION: 27dcfa74d334bc871f3234de431e71c6eeba5dd6
          HF_HUB_OFFLINE: "1"
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
        run: |
          mkdir -p oracle/out/scenarios-offloading
          python -I oracle/run_offloading.py vllm-source oracle/scenarios/offloading oracle/out/scenarios-offloading
      - name: every offloading golden trace is vLLM's own output
        run: python3 -I oracle/compare_goldens.py core/connector/offloading/testdata/golden oracle/out/scenarios-offloading
      - name: blis-vllm's OffloadingConnector against vLLM's (scenarios + fuzz)
        env:
          BLIS_VLLM_OFFLOAD_FUZZ_DIR: ${{ github.workspace }}/oracle/out/fuzz-offloading
        run: |
          set -o pipefail
          go test -v -count=1 -run 'TestOffloadingAgainstVLLM|TestOffloadingFuzzCorpusAgainstVLLM' ./core/connector/offloading/ | tee oracle/out/offloading-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: oracle-tier2
          path: |
            oracle/out/
            oracle-env.lock
