name: blis

# The shared BLIS checks (design §13.2, §13.4), called from blis-substrate by commit (X21):
# the pull-request checks (description, review questions, commit policy, workflow lint,
# version literals, documentation references, cited issues, quarantine, the generated
# AGENTS.md section and pull-request template, the selected-version lint), and the
# nightly checks (cited issues stay open, X28).
#
# The commit is layer 1 of blis-substrate's M2 stack, which stops the pull-request check failing on a review question
# a person has not answered (they are guidance for the review agent). It moves to the release tag's commit when the
# stack's release is cut.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    uses: inference-sim/blis-substrate/.github/workflows/shared-pr-checks.yml@f36f6b2e4900f2556c7f64940a657a89e89c756b
    permissions:
      contents: read
      pull-requests: write
      checks: write
    with:
      repo: blis-vllm
      substrate-ref: f36f6b2e4900f2556c7f64940a657a89e89c756b

  # No BLIS repository uses a merge queue (design X22), so there is no merge job here.
  # shared-merge-check.yml stays available in blis-substrate if a queue is ever enabled.

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: inference-sim/blis-substrate/.github/workflows/shared-nightly.yml@f36f6b2e4900f2556c7f64940a657a89e89c756b
    permissions:
      contents: read
      issues: read
    with:
      substrate-ref: f36f6b2e4900f2556c7f64940a657a89e89c756b
    secrets:
      INTERNAL_NAME_PATTERNS: ${{ secrets.INTERNAL_NAME_PATTERNS }}
