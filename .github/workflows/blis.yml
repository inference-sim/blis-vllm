name: blis

# The shared BLIS checks (design §13.2, §13.4), called from blis-substrate by commit (X21):
# the pull-request checks (description, review questions, commit policy, workflow lint,
# version literals, documentation references, cited issues, quarantine, the generated
# AGENTS.md section and pull-request template, the selected-version lint), the merge check on
# the merge-queue tree, and the nightly checks (cited issues stay open, X28).
#
# The commit is the head of blis-substrate's M1 integration branch (#6), which go.mod also pins; it moves to
# a substrate release tag's commit when that release is cut.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    uses: inference-sim/blis-substrate/.github/workflows/shared-pr-checks.yml@ce9fb30f879aaa7b789348689da0b4166a2a57c1
    permissions:
      contents: read
      pull-requests: write
    with:
      repo: blis-vllm
      substrate-ref: ce9fb30f879aaa7b789348689da0b4166a2a57c1

  merge:
    if: github.event_name == 'merge_group'
    uses: inference-sim/blis-substrate/.github/workflows/shared-merge-check.yml@ce9fb30f879aaa7b789348689da0b4166a2a57c1
    permissions:
      contents: read
      pull-requests: read
      checks: read
    with:
      substrate-ref: ce9fb30f879aaa7b789348689da0b4166a2a57c1
      required: "go,lint,blis checks / blis checks"

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: inference-sim/blis-substrate/.github/workflows/shared-nightly.yml@ce9fb30f879aaa7b789348689da0b4166a2a57c1
    permissions:
      contents: read
      issues: read
    with:
      substrate-ref: ce9fb30f879aaa7b789348689da0b4166a2a57c1
