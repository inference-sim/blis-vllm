name: oracle environment
description: >-
  The pinned oracle environment, as the oracle jobs of ci.yml use it: Python, vLLM v0.32.0 checked out at
  its pinned commit into vllm-source, every package of oracle/requirements.lock installed from
  oracle/requirements-hashed.txt (every archive's sha256, no resolving; the step fails unless what got
  installed is exactly the lock), and the helper model's configuration at its pinned revision in
  oracle-model. The caller has checked out the repository.
outputs:
  python-version:
    description: The exact Python setup-python installed.
    value: ${{ steps.python.outputs.python-version }}
runs:
  using: composite
  steps:
    - id: python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: oracle/requirements-hashed.txt
    - name: check out vLLM v0.32.0 (for its test helpers) at its pinned commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: vllm-project/vllm
        ref: 5df63a7203cdb9328d824a27b682e77c7b9928be
        path: vllm-source
        fetch-depth: 1
    - name: the checked-out vLLM is the pinned commit
      shell: bash
      run: test "$(git -C vllm-source rev-parse HEAD)" = 5df63a7203cdb9328d824a27b682e77c7b9928be
    # The whole environment is pinned (oracle/requirements.lock, every package == or a sha256
    # URL) and installed without resolving, from oracle/requirements-hashed.txt with every
    # archive's sha256 (oracle/lock.sh, X21), so neither a transitive release nor a replaced
    # archive can change a run; the step fails if what got installed is not exactly the lock.
    - name: install the oracle environment
      shell: bash
      run: |
        set -euo pipefail
        python -I oracle/check_lock.py --hashed oracle/requirements.lock oracle/requirements-hashed.txt
        python -m pip install --require-hashes -r oracle/requirements-pip.txt
        pip install --require-hashes --no-deps --extra-index-url https://download.pytorch.org/whl/cpu -r oracle/requirements-hashed.txt
        pip check
        pip freeze > oracle-env.lock
        python -I oracle/check_lock.py oracle/requirements.lock oracle-env.lock
    # The scheduler helper's default model, as configuration only (no weights), at a pinned
    # revision, so a change on the Hub cannot change a run.
    - name: fetch the helper model's configuration at its pinned revision
      shell: bash
      run: |
        python - <<'PY'
        from huggingface_hub import snapshot_download
        snapshot_download("facebook/opt-125m", revision="27dcfa74d334bc871f3234de431e71c6eeba5dd6",
                          local_dir="oracle-model", allow_patterns=["*.json", "*.txt"])
        PY
