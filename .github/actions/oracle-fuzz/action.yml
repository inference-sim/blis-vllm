name: oracle fuzz corpora
description: >-
  The seeded fuzz corpora (tier 2, tier 3 and DP, the NIXL connector) and vLLM v0.32.0's traces
  for them, restored from the cache or, on a miss, generated by the pinned oracle and saved. A
  corpus is a pure function of its generator, its seeds, the runners that drive vLLM over it, the
  GPU mock, the oracle environment and the vLLM commit, so each cache key hashes exactly those;
  any change to one regenerates the corpus. The committed goldens are not cached: the calling
  job re-derives them from vLLM on every run. The caller has already checked vLLM out at its
  pinned commit into vllm-source, installed oracle/requirements.lock and fetched the helper
  model into oracle-model.
inputs:
  python-version:
    description: The exact Python setup-python installed (its python-version output).
    required: true
runs:
  using: composite
  steps:
    # The seeds, as start-count ranges joined by "_" (a cache key cannot hold a comma). They are
    # the key's and the commands' one source.
    - name: the fuzz corpora's seeds and pins
      shell: bash
      run: |
        {
          echo "FUZZ_T2_SEEDS=1000-2000_5000-2000"
          echo "FUZZ_T3_SEEDS=1000-1000"
          echo "FUZZ_DP_SEEDS=1000-500_2000-500"
          echo "FUZZ_OFFLOAD_SEEDS=1-1000_20000-1000_40000-600"
          echo "FUZZ_CONNECTOR_SEEDS=1-1000_10000-300_20000-1000_30000-1000"
          echo "FUZZ_VLLM_COMMIT=5df63a7203cdb9328d824a27b682e77c7b9928be"
          echo "FUZZ_MODEL_REVISION=27dcfa74d334bc871f3234de431e71c6eeba5dd6"
        } >> "$GITHUB_ENV"
    # The key names the vLLM commit, so it must be the one that ran.
    - name: the vLLM the corpora are keyed on is the checked-out one
      shell: bash
      run: test "$(git -C vllm-source rev-parse HEAD)" = "$FUZZ_VLLM_COMMIT"
    - id: keys
      name: the cache keys
      shell: bash
      run: |
        # The runner image, Python, the installed environment exactly as frozen (oracle-env.lock,
        # whose sha256 every trace records), the vLLM commit and the helper model's revision.
        base="${ImageOS:-unknown}-${{ runner.arch }}-py${{ inputs.python-version }}-env-${{ hashFiles('oracle-env.lock') }}-vllm-${FUZZ_VLLM_COMMIT}-model-${FUZZ_MODEL_REVISION}"
        echo "t2=oracle-fuzz-t2-${base}-${FUZZ_T2_SEEDS}-${{ hashFiles('.github/actions/oracle-fuzz/action.yml', 'oracle/gen_fuzz.py', 'oracle/run_scheduler.py', 'oracle/run_metrics.py', 'oracle/mocks.json', 'oracle/requirements.lock', 'oracle/drafts/**') }}" >> "$GITHUB_OUTPUT"
        echo "t3=oracle-fuzz-t3-${base}-${FUZZ_T3_SEEDS}-dp-${FUZZ_DP_SEEDS}-${{ hashFiles('.github/actions/oracle-fuzz/action.yml', 'oracle/gen_fuzz.py', 'oracle/gen_fuzz_t3.py', 'oracle/gen_fuzz_dp.py', 'oracle/run_scheduler.py', 'oracle/run_enginecore.py', 'oracle/run_dp.py', 'oracle/mocks.json', 'oracle/requirements.lock', 'oracle/drafts/**') }}" >> "$GITHUB_OUTPUT"
        echo "connector=oracle-fuzz-connector-${base}-${FUZZ_CONNECTOR_SEEDS}-${{ hashFiles('.github/actions/oracle-fuzz/action.yml', 'oracle/gen_connector_fuzz.py', 'oracle/run_scheduler.py', 'oracle/run_enginecore.py', 'oracle/run_connector.py', 'oracle/mocks.json', 'oracle/requirements.lock', 'oracle/drafts/**') }}" >> "$GITHUB_OUTPUT"
        echo "offloading=oracle-fuzz-offloading-${base}-${FUZZ_OFFLOAD_SEEDS}-${{ hashFiles('.github/actions/oracle-fuzz/action.yml', 'oracle/gen_offloading_fuzz.py', 'oracle/run_scheduler.py', 'oracle/run_offloading.py', 'oracle/mocks.json', 'oracle/requirements.lock') }}" >> "$GITHUB_OUTPUT"

    # Tier 2: 4000 random scenarios through vLLM's Scheduler and its Prometheus logger.
    - id: t2
      name: restore the tier-2 fuzz corpus and vLLM's traces
      uses: actions/cache/restore@v4
      with:
        path: oracle/out/fuzz
        key: ${{ steps.keys.outputs.t2 }}
    - name: generate the tier-2 fuzz corpus and vLLM's traces for it (cache miss)
      if: steps.t2.outputs.cache-hit != 'true'
      shell: bash
      env:
        ORACLE_LOCKFILE: ${{ github.workspace }}/oracle-env.lock
        ORACLE_MODEL: ${{ github.workspace }}/oracle-model
        HF_HUB_OFFLINE: "1"
      run: |
        export ORACLE_MODEL_REVISION="$FUZZ_MODEL_REVISION"
        # Seeds 5000-6999 add speculative decoding, LoRA and the scheduler knobs.
        for r in ${FUZZ_T2_SEEDS//_/ }; do python -I oracle/gen_fuzz.py oracle/out/fuzz "${r%-*}" "${r#*-}"; done
        python -I oracle/run_scheduler.py vllm-source oracle/out/fuzz
        python -I oracle/run_metrics.py vllm-source oracle/out/fuzz
    - name: save the t2 fuzz corpus and vLLM's traces (cache miss)
      if: steps.t2.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: oracle/out/fuzz
        key: ${{ steps.keys.outputs.t2 }}

    # Tier 3: 1000 scenarios through vLLM's EngineCore, and 1000 through its DP engine-core loop.
    - id: t3
      name: restore the tier-3 and DP fuzz corpora and vLLM's traces
      uses: actions/cache/restore@v4
      with:
        path: |
          oracle/out/fuzz-t3
          oracle/out/fuzz-t3-dp
        key: ${{ steps.keys.outputs.t3 }}
    - name: generate the tier-3 and DP fuzz corpora and vLLM's traces for them (cache miss)
      if: steps.t3.outputs.cache-hit != 'true'
      shell: bash
      env:
        ORACLE_LOCKFILE: ${{ github.workspace }}/oracle-env.lock
        ORACLE_MODEL: ${{ github.workspace }}/oracle-model
        HF_HUB_OFFLINE: "1"
      run: |
        export ORACLE_MODEL_REVISION="$FUZZ_MODEL_REVISION"
        for r in ${FUZZ_T3_SEEDS//_/ }; do python -I oracle/gen_fuzz_t3.py oracle/out/fuzz-t3 "${r%-*}" "${r#*-}"; done
        python -I oracle/run_enginecore.py vllm-source oracle/out/fuzz-t3
        for r in ${FUZZ_DP_SEEDS//_/ }; do python -I oracle/gen_fuzz_dp.py oracle/out/fuzz-t3-dp "${r%-*}" "${r#*-}"; done
        python -I oracle/run_dp.py vllm-source oracle/out/fuzz-t3-dp
    - name: save the t3 fuzz corpus and vLLM's traces (cache miss)
      if: steps.t3.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          oracle/out/fuzz-t3
          oracle/out/fuzz-t3-dp
        key: ${{ steps.keys.outputs.t3 }}

    # Tier 4: 3300 NIXL connector scenarios through vLLM's Scheduler with the real connector.
    - id: connector
      name: restore the connector fuzz corpus and vLLM's traces
      uses: actions/cache/restore@v4
      with:
        path: oracle/out/fuzz-connector
        key: ${{ steps.keys.outputs.connector }}
    - name: generate the connector fuzz corpus and vLLM's traces for it (cache miss)
      if: steps.connector.outputs.cache-hit != 'true'
      shell: bash
      env:
        ORACLE_LOCKFILE: ${{ github.workspace }}/oracle-env.lock
        ORACLE_MODEL: ${{ github.workspace }}/oracle-model
        HF_HUB_OFFLINE: "1"
      run: |
        export ORACLE_MODEL_REVISION="$FUZZ_MODEL_REVISION"
        mkdir -p oracle/out/fuzz-connector
        # Seeds 10000+ run requests into max_model_len (the connector side's length caps); 20000+
        # add hybrid KV cache groups and drafters; 30000+ the batch queue (async scheduling, PP).
        for r in ${FUZZ_CONNECTOR_SEEDS//_/ }; do python -I oracle/gen_connector_fuzz.py oracle/out/fuzz-connector "${r%-*}" "${r#*-}"; done
        python -I oracle/run_connector.py vllm-source oracle/out/fuzz-connector
    - name: save the connector fuzz corpus and vLLM's traces (cache miss)
      if: steps.connector.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: oracle/out/fuzz-connector
        key: ${{ steps.keys.outputs.connector }}

    # Tier 4: 2000 OffloadingConnector scenarios through vLLM's Scheduler with the real connector.
    - id: offloading
      name: restore the offloading fuzz corpus and vLLM's traces
      uses: actions/cache/restore@v4
      with:
        path: oracle/out/fuzz-offloading
        key: ${{ steps.keys.outputs.offloading }}
    - name: generate the offloading fuzz corpus and vLLM's traces for it (cache miss)
      if: steps.offloading.outputs.cache-hit != 'true'
      shell: bash
      env:
        ORACLE_LOCKFILE: ${{ github.workspace }}/oracle-env.lock
        ORACLE_MODEL: ${{ github.workspace }}/oracle-model
        HF_HUB_OFFLINE: "1"
      run: |
        export ORACLE_MODEL_REVISION="$FUZZ_MODEL_REVISION"
        mkdir -p oracle/out/fuzz-offloading
        # Seeds 20000+ add sliding-window KV cache groups beside full attention; 40000+ several workers.
        for r in ${FUZZ_OFFLOAD_SEEDS//_/ }; do python -I oracle/gen_offloading_fuzz.py oracle/out/fuzz-offloading "${r%-*}" "${r#*-}"; done
        python -I oracle/run_offloading.py vllm-source oracle/out/fuzz-offloading
    - name: save the offloading fuzz corpus and vLLM's traces (cache miss)
      if: steps.offloading.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: oracle/out/fuzz-offloading
        key: ${{ steps.keys.outputs.offloading }}

    # Provenance for this run's corpora: each corpus's key, whether it came from the cache, and
    # the blis-vllm commit of the run that generated its traces (the traces themselves depend
    # only on what the key hashes). The run's own commit is in oracle/out/provenance.json.
    - name: record where this run's fuzz traces came from
      shell: bash
      env:
        T2_KEY: ${{ steps.keys.outputs.t2 }}
        T2_HIT: ${{ steps.t2.outputs.cache-hit }}
        T3_KEY: ${{ steps.keys.outputs.t3 }}
        T3_HIT: ${{ steps.t3.outputs.cache-hit }}
        CONNECTOR_KEY: ${{ steps.keys.outputs.connector }}
        CONNECTOR_HIT: ${{ steps.connector.outputs.cache-hit }}
        OFFLOADING_KEY: ${{ steps.keys.outputs.offloading }}
        OFFLOADING_HIT: ${{ steps.offloading.outputs.cache-hit }}
      run: |
        python3 -I - <<'PY'
        import glob, json, os

        def corpus(key, hit, *dirs):
            traces = sorted(t for d in dirs for t in glob.glob(f"oracle/out/{d}/*.trace.json"))
            if not traces:
                raise SystemExit(f"no traces in {dirs}")
            made_at = sorted({json.load(open(t))["provenance"].get("blis_vllm_commit") for t in traces[:50]})
            return {"key": os.environ[key], "cache_hit": os.environ[hit] == "true",
                    "traces": len(traces), "generated_by_blis_vllm_commit": made_at}

        out = {"run_blis_vllm_commit": os.environ["GITHUB_SHA"],
               "tier2": corpus("T2_KEY", "T2_HIT", "fuzz"),
               "tier3_and_dp": corpus("T3_KEY", "T3_HIT", "fuzz-t3", "fuzz-t3-dp"),
               "connector": corpus("CONNECTOR_KEY", "CONNECTOR_HIT", "fuzz-connector"),
               "offloading": corpus("OFFLOADING_KEY", "OFFLOADING_HIT", "fuzz-offloading")}
        json.dump(out, open("oracle/out/fuzz-cache.json", "w"), indent=1)
        print(json.dumps(out, indent=1))
        PY
