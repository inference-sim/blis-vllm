kind: Scenario
name: muse-h100-roce-1p1d-multi
engine_version: "0.32.0"
model: muse-spark-open-816b-a42b-nvfp4
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-fabric, cost-model-offload-tiers]
cluster:
  hardware: h100
  fabric: roce-200g
  nodes: 4
  gpus_per_node: 8
---
kind: Deployment
name: muse-h100-roce-1p1d-multi
pools:
  - role: prefill
    nodes: 2
    parallel: {tp: 16, pp: 1, dp: 1, enable_expert_parallel: true}
    engine:
      block_size: 16
      max_num_seqs: 64
      max_num_batched_tokens: 8192
      max_model_len: 262144
      enable_prefix_caching: true
      gpu_memory_utilization: 0.9
      async_scheduling: true
      moe_backend: marlin
  - role: decode
    nodes: 2
    parallel: {tp: 16, pp: 1, dp: 1, enable_expert_parallel: true}
    engine:
      block_size: 16
      max_num_seqs: 64
      max_num_batched_tokens: 8192
      max_model_len: 262144
      enable_prefix_caching: true
      gpu_memory_utilization: 0.9
      async_scheduling: true
      moe_backend: marlin
pd_transfer:
  connector: MultiConnector

# The NIXL handoff and a CPU tier together are vLLM's MultiConnector. The schema states neither the
# children nor their order, so the engine assumes NIXL first, then the OffloadingConnector over this tier.
offload:
  connector: OffloadingConnector
  eviction_policy: lru
  tiers:
    - {tier: cpu_dram, bytes: 549755813888}
