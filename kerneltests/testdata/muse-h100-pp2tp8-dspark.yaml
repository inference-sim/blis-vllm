kind: Scenario
name: muse-h100-pp2tp8-dspark
engine_version: "0.32.0"
model: muse-spark-open-816b-a42b-nvfp4
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]
cluster:
  hardware: h100
  fabric: roce-200g
  nodes: 2
  gpus_per_node: 8
---
kind: Deployment
name: muse-h100-pp2tp8-dspark
pools:
  - role: colocated
    nodes: 2
    parallel: {tp: 8, pp: 2, dp: 1, enable_expert_parallel: true}
    engine:
      block_size: 16
      max_num_seqs: 64
      max_num_batched_tokens: 8192
      max_model_len: 262144
      moe_backend: marlin
      enable_prefix_caching: true
      speculative:
        method: dspark
        num_spec_tokens: 7
        draft_model: muse-spark-open-dspark
